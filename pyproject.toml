[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bugphyzz-reconstruction"
version = "0.0.1"
description = "Microbial trait preparation, ancestral-state reconstruction, and Bugphyzz release generation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Levi Waldron"}]
license = "MIT"
keywords = ["microbiology", "phylogenetics", "ancestral-state-reconstruction", "microbial-traits", "bioinformatics"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "biopython>=1.80",
]

[project.optional-dependencies]
# Only needed when rebuilding taxonomy references with scripts/build_resources.py.
taxonomy = ["ete3>=3.1.3"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "build>=1.2",
  "twine>=5",
  "check-wheel-contents>=0.6",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["bugphyzz_reconstruction", "bugphyzz_reconstruction.*"]
exclude = ["bugphyzz_reconstruction.tests", "bugphyzz_reconstruction.tests.*"]
namespaces = true

[tool.setuptools.package-data]
bugphyzz_reconstruction = [
  "resources/*.tsv",
  "resources/*.txt",
  "resources/taxonomy_2023/*.tsv",
  "resources/taxonomy_2023/*.newick",
  "resources/taxonomy_2023/*.tip_data",
  "resources/taxonomy_2023/*.node_data",
  "resources/taxonomy_2023/*.ntree",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
